[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vsumbench"
dynamic = ["version"]
description = "Unified, reproducible evaluation toolkit for video summarization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Axon123" }]
keywords = ["video-summarization", "benchmark", "evaluation", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Iron rule 1 (AGENTS.md): core = numpy + h5py + stdlib only.
dependencies = [
    "numpy>=1.24",
    "h5py>=3.8",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.scripts]
vsumm = "vsumbench.cli:main"

# Built-in components register themselves through the same entry-point groups
# that third-party packages use (see docs/design/core-contracts.md §5):
#   vsumbench.datasets / vsumbench.models / vsumbench.selectors
#   vsumbench.metrics (summary metrics) / vsumbench.rank_metrics (rank metrics)
# Models (M3), selectors and metrics (M2) land here later.
[project.entry-points."vsumbench.datasets"]
tvsum = "vsumbench.data.tvsum:TVSUM_ADAPTER"
summe = "vsumbench.data.summe:SUMME_ADAPTER"

[tool.setuptools.dynamic]
version = { attr = "vsumbench.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vsumbench = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "h5py.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not integration"]
markers = [
    "integration: end-to-end tests on real datasets (opt-in, need VSUM_CACHE_DIR data)",
    "alignment: golden-fixture alignment tests against original implementations",
]
